services:
  - type: web
    name: canteen-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: canteen-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: "production"

databases:
  - name: canteen-db
    plan: free
